# Проверка новых событий по расписанию.
#
# Три job:
#   run   — сбор, оценка, отправка. Токен GitHub только на чтение: процесс обрабатывает контент из интернета.
#   save  — сохраняет память бота в ветку state (здесь токен на запись, но чужой контент не обрабатывается).
#   alert — сообщение в Telegram, если что-то упало.
name: check

on:
  schedule:
    # каждые 2 часа с 7:00 до 23:00 по Токио (cron — по UTC: JST = UTC+9). GitHub может запускать с опозданием.
    - cron: "0 22,0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run: ничего не отправлять в Telegram и не сохранять память"
        type: boolean
        default: false
      hotels_now:
        description: "проверить цены отелей сейчас (обычно — в 9, 15 и 19 ч по Токио)"
        type: boolean
        default: false

# два запуска одновременно прислали бы одно и то же дважды
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # с проверкой цен отелей (~55 мест × 13 дат, раз в секунду) — до ~20 минут
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false

      - name: Зависимости
        run: uv sync --frozen --no-dev

      - name: Загрузить память из ветки state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/state.sh pull

      - name: Проверить события
        timeout-minutes: 50
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          HOTELS_NOW: ${{ inputs.hotels_now && '--hotels-now' || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # цены отелей: без ключей проверка просто выключена
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: uv run --no-sync tokyo-events run $DRY_RUN $HOTELS_NOW

      - name: Передать память в job save
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  save:
    needs: run
    # и после ошибки: то, что уже отправлено, должно запомниться, иначе придёт повторно
    if: always() && !inputs.dry_run && needs.run.result != 'skipped' && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Получить память из job run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state/

      - name: Сохранить память в ветку state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/state.sh push

  alert:
    needs: [run, save]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Сообщить в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: "⚠️ Tokyo Events: проверка событий завершилась с ошибкой: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram не настроен — оповещение только письмом GitHub"; exit 0
          fi
          # TELEGRAM_CHAT_ID — один id или несколько через запятую
          for chat in ${TELEGRAM_CHAT_ID//,/ }; do
            curl -sS -o /dev/null --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat}" --data-urlencode "text=${TEXT}" || true
          done
