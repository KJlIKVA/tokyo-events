[project]
name = "tokyo-events"
version = "0.1.0"
description = "Новые события в Токио и концерты любимых артистов — уведомления в Telegram с рангами 🟢🟠🟣"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.26.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
tokyo-events = "tokyo_events.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица и японская типографика в строках — это нормально

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # японские строки-примеры: широкие символы считаются за два
