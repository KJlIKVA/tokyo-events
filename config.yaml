# Настройки Tokyo Events. Секреты (токены) здесь НЕ хранятся: они в GitHub Secrets / локальном .env.

timezone: Asia/Tokyo

# Как часто проверять — задаётся в .github/workflows/check.yml (cron, по UTC). Сейчас: каждые 2 часа с 7:00 до 23:00 JST.

llm:
  model: gpt-5.6-terra
  effort: low
  max_output_tokens: 16000     # на один пакет, включая рассуждение
  batch_size: 20               # сколько находок отправлять модели за один вызов
  max_items_per_run: 120       # больше за запуск не разбираем: остальное подождёт следующего запуска
  daily_token_limit: 1000000   # жёсткий потолок токенов в сутки (UTC); вызов, который может его превысить, не делается
  request_timeout_s: 180
  # для отчёта о расходах в логах (USD за 1M токенов)
  price_per_1m: {input: 2.50, cached_input: 0.25, output: 15.00}
  # Шаг 2: по каждому отобранному событию код сам скачивает статью, а модель по её тексту пишет даты, цену,
  # место и описание. Модель НЕ ищет в интернете (дорого); ссылки — официальный сайт из статьи, иначе сайт
  # площадки из Wikidata, и Google Maps — находит код.
  # Без чётких дат (только «2027 год») уведомление не отправляется — придёт, когда даты объявят.
  enrich:
    effort: low
    max_output_tokens: 6000
    article_chars: 5000            # сколько знаков статьи давать модели
    max_per_run: 20                # больше за запуск не разбираем: остальное — в следующий раз

filters:
  max_age_hours: 72            # находки старше этого молча помечаются просмотренными (не уведомляем о старом)
  first_run_hours: 12          # самый первый запуск источника: только последние 12 часов, чтобы не завалить старым
  notify_ranks: [green, orange, purple]
  silent_ranks: [green]        # приходят без звука
  memory_days: 45              # (старый формат памяти; события теперь в базе state/events.db)
  memory_events: 150           # сколько последних событий из базы показывать модели для поиска дублей и обновлений
  seen_days: 60                # сколько дней помнить просмотренные ссылки
  max_new_undated: 10          # если на странице без дат разом появилось больше новых ссылок — это перестройка
                               # сайта, а не новости: молча запоминаем

# Скидки для поездок (отели, рёканы, онсэны, синкансэн, достопримечательности) — по всей Японии.
# Присылаются от min_pct; цвет — по размеру скидки.
deals:
  min_pct: 10
  orange_pct: 30
  purple_pct: 50

# Цены отелей и рёканов (API 楽天トラベル, без ИИ): скидка к обычной цене того же отеля — по порогам deals.
# Работает, только если заданы RAKUTEN_APPLICATION_ID и RAKUTEN_ACCESS_KEY (uv run tokyo-events setup-rakuten).
hotels:
  enabled: true
  run_at_hours: [9, 19]        # по Токио — дважды в день, чтобы не дёргать API каждые 2 часа
  adults: 2
  nights: 1
  meals: two_meals             # two_meals — ужин и завтрак (как обычно у рёканов); any — любой план
  weekends_ahead: 6            # цены на 6 ближайших суббот — из них «обычная цена»
  alert_weekends: 3            # о скидках сообщать на 3 ближайшие субботы
  min_saving_yen: 3000         # и экономия не меньше 3 000 ¥
  min_review: 3.5              # отели с рейтингом ниже не присылать
  max_alerts_per_run: 5
  areas:                       # центр онсэн-городка; радиус до 3 км
    - {name: Хаконэ-Юмото, lat: 35.2329, lon: 139.1067}
    - {name: Хаконэ-Гора, lat: 35.2483, lon: 139.0469}
    - {name: Атами, lat: 35.0965, lon: 139.0717}
    - {name: Ито, lat: 34.9658, lon: 139.1020}
    - {name: Сюдзэндзи, lat: 34.9703, lon: 138.9306}
    - {name: Югавара, lat: 35.1386, lon: 139.0828}
    - {name: Кусацу, lat: 36.6227, lon: 138.5966}
    - {name: Икахо, lat: 36.4975, lon: 138.9203}
    - {name: Киногава, lat: 36.8237, lon: 139.7124}
    - {name: Кавагутико, lat: 35.5016, lon: 138.7656}

# Город для 🟢 и 🟠. 🟣 «грандиозные события» — по всей Японии.
area: "Токио (23 района и район Тама)"

# Любимые артисты: их концерты — всегда 🟣.
# aliases — как имя пишут в заголовках (латиница сравнивается целым словом и с учётом регистра).
artists:
  - name: Ado
    aliases: [Ado]
    about: "японская певица Ado (без лица на публике, хиты «うっせぇわ», «新時代»)."
  - name: YOASOBI
    aliases: [YOASOBI]
    about: "дуэт YOASOBI (Ayase и ikura). Сольные выступления ikura / 幾田りら или Ayase — это НЕ концерт YOASOBI."
  - name: RADWIMPS
    aliases: [RADWIMPS, ラッドウィンプス]
    about: "рок-группа RADWIMPS (Ёдзиро Нода, саундтреки к фильмам Синкая)."
  - name: 美波
    aliases: [美波]
    about: >-
      певица и автор песен 美波 (Minami): официальный сайт 373official.com, фан-клуб Team373,
      песни «カワキヲアメク» (опенинг аниме «Domestic na Kanojo», 2019) и «ライラック».
      НЕ путать с актрисой 美波 (Minami, род. 1986), с другими людьми по имени Минами (南, みなみ, MINAMI,
      美波 как часть другого имени), с районом Минами в Осаке и фестивалем MINAMI WHEEL.
      Если по тексту нельзя уверенно сказать, что это именно певица 美波 — это не она.
  - name: ヨルシカ
    aliases: [ヨルシカ, Yorushika]
    about: "дуэт ヨルシカ / Yorushika (n-buna и suis)."

# Источники.
#   kind: rss — RSS/Atom-лента; google_news — поиск Google Новостей (q как в поиске, when:2d = за 2 дня);
#         page — страница новостей без ленты: новые ссылки по link_pattern считаются новостями.
#   artists_only: true — дальше проходят только записи, где упомянут кто-то из artists (для общих лент).
#   artist — официальный источник одного артиста: все записи про него.
sources:
  # --- артисты: официальные сайты ---
  - id: minami_official
    kind: rss
    url: https://www.373official.com/rss.xml
    artist: 美波
  - id: radwimps_official
    kind: page
    url: https://radwimps.jp/news/
    link_pattern: '^https://radwimps\.jp/news/\d+/$'
    artist: RADWIMPS
  - id: yorushika_official
    kind: page
    url: https://yorushika.com/news
    link_pattern: '/news/detail/\d+$'
    artist: ヨルシカ

  # --- артисты: музыкальные новости (у Ado и YOASOBI нет ленты на сайте) ---
  # natalie.mu напрямую не отдаёт ленту серверам GitHub (405) — читаем его через Google Новости
  - id: gn_natalie_artists
    kind: google_news
    q: 'site:natalie.mu (Ado OR YOASOBI OR RADWIMPS OR ヨルシカ OR 美波) when:3d'
    artists_only: true
  - id: gn_artists_live
    kind: google_news
    q: '(Ado OR YOASOBI OR RADWIMPS OR ヨルシカ) (ライブ OR ツアー OR 公演 OR 出演 OR ドーム) when:2d'
    artists_only: true
  - id: gn_minami_live
    kind: google_news
    q: '美波 (ライブ OR ツアー OR 公演 OR ワンマン) when:3d'
    artists_only: true

  # --- Токио ---
  - id: tokyo_cheapo
    kind: rss
    url: https://tokyocheapo.com/feed/
  - id: gn_tokyo_exhibitions
    kind: google_news
    q: '(東京 OR 都内) (展覧会 OR 美術館 OR 博物館) (開催決定 OR 開幕 OR 巡回) when:2d'
  - id: gn_tokyo_openings
    kind: google_news
    q: '(東京 OR 都内) (オープン OR 開業 OR 開園 OR グランドオープン) when:2d'
  - id: gn_tokyo_festivals
    kind: google_news
    q: '(東京 OR 都内) (祭り OR フェス OR フェスティバル OR 花火大会 OR イルミネーション) 開催 when:2d'
  - id: gn_tokyo_en
    kind: google_news
    q: 'Tokyo (exhibition OR festival OR "grand opening" OR "opens") when:2d'
    lang: en

  # --- скидки для поездок (по всей Японии) ---
  - id: gn_deals_hotels
    kind: google_news
    q: '(旅館 OR ホテル OR 温泉 OR 宿泊) (半額 OR 最大50%OFF OR 最大70%OFF OR タイムセール OR スーパーSALE OR 割引キャンペーン) when:2d'
  - id: gn_deals_rail
    kind: google_news
    q: '(新幹線 OR JR OR えきねっと OR 特急) (半額 OR 割引 OR トクだ値 OR 早特 OR お得な切符) (発売 OR キャンペーン OR 開始) when:3d'
  - id: gn_deals_attractions
    kind: google_news
    q: '(入場無料 OR 入館無料 OR 半額 OR 割引) (水族館 OR 遊園地 OR テーマパーク OR 美術館 OR 博物館 OR 動物園) キャンペーン when:2d'
  - id: gn_deals_travel_support
    kind: google_news
    q: '(旅行支援 OR 宿泊割引 OR 旅行割 OR 観光キャンペーン) (開始 OR 受付 OR 割引) when:3d'

  # --- грандиозное по всей Японии ---
  - id: gn_japan_big
    kind: google_news
    q: '(万博 OR 国際博覧会 OR オリンピック OR ワールドカップ OR 世界選手権 OR 日本初開催 OR 国内初開催) (開催決定 OR 開催 OR 開幕) when:2d'
